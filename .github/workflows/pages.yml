name: Deploy to GitHub Pages

# 【重要】検査を通ったものだけを配置する。
# 型検査とテストが落ちたら、そこで止まる。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # SheetJS は npm ではなく公式配布から入る（README「動かし方」を参照）。
      # そのため npm ci はネットワークを使う。
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # base を /csv-tidy/ にする。GitHub Pages はリポジトリ名のサブパスで配信される。
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
      # オフラインの一覧に取りこぼしが無いか。チャンクが増えて
      # 一覧から漏れると、オフラインのときだけ黙って壊れる。
      - run: node scripts/check-offline.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
